openapi: 3.0.3
info:
  title: ZecPath API
  version: 1.0.0
  description: API documentation for the ZecPath recruitment platform.
paths:
  /api/accounts/admin/audit-logs/:
    get:
      operationId: accounts_admin_audit_logs_list
      description: Returns admin audit records ordered from newest to oldest. Requires
        administrator authentication.
      summary: List admin audit logs
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminActionLog'
          description: ''
  /api/accounts/admin/dashboard/:
    get:
      operationId: accounts_admin_dashboard_retrieve
      summary: Get the admin dashboard
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Operation result
  /api/accounts/admin/employers/{user_id}/approve/:
    patch:
      operationId: accounts_admin_employers_approve_partial_update
      description: Marks the specified employer as verified and records the action
        in the admin audit log.
      summary: Approve an employer
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Operation result
  /api/accounts/admin/stats/:
    get:
      operationId: accounts_admin_stats_retrieve
      summary: Get platform statistics
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStats'
          description: ''
  /api/accounts/admin/users/{user_id}/block/:
    patch:
      operationId: accounts_admin_users_block_partial_update
      description: Deactivates the specified user and records the action in the admin
        audit log.
      summary: Block a user
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Operation result
  /api/accounts/candidate-dashboard/:
    get:
      operationId: candidate_dashboard_legacy_retrieve
      description: Legacy URL for candidate dashboard statistics. Returns the same
        data as the nested candidate dashboard endpoint.
      summary: Get candidate dashboard statistics (legacy URL)
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
          description: ''
  /api/accounts/candidate/dashboard/:
    get:
      operationId: candidate_dashboard_nested_retrieve
      summary: Get candidate dashboard statistics
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
          description: ''
  /api/accounts/employer/dashboard/:
    get:
      operationId: accounts_employer_dashboard_retrieve
      summary: Get the employer dashboard
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Operation result
  /api/accounts/login/:
    post:
      operationId: accounts_login_create
      description: Authenticate with the user's credentials to obtain an access token
        and a refresh token.
      summary: Obtain JWT tokens
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/accounts/logout/:
    post:
      operationId: accounts_logout_create
      description: Submit the refresh token to invalidate it according to the configured
        token blacklist flow.
      summary: Log out a user
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Operation result
        '400':
          description: Invalid refresh token
  /api/accounts/profile/:
    get:
      operationId: accounts_profile_retrieve
      summary: Get the authenticated user's profile
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/accounts/refresh/:
    post:
      operationId: accounts_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/accounts/signup/:
    post:
      operationId: accounts_signup_create
      summary: Register a new user
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Signup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Signup'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Operation result
        '400':
          description: Invalid signup data
  /api/admin/billing/failures/:
    get:
      operationId: admin_billing_failures_retrieve
      summary: List admin payment failures
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Payment failures retrieved successfully.
  /api/admin/billing/refunds/:
    get:
      operationId: admin_billing_refunds_retrieve
      summary: List admin refunds
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Refunds retrieved successfully.
  /api/admin/billing/revenue/:
    get:
      operationId: admin_billing_revenue_retrieve
      summary: Retrieve admin revenue
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Revenue details retrieved successfully.
  /api/admin/billing/subscriptions/:
    get:
      operationId: admin_billing_subscriptions_retrieve
      summary: List admin subscription history
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Subscription history retrieved successfully.
  /api/admin/billing/transactions/:
    get:
      operationId: admin_billing_transactions_retrieve
      summary: List admin billing transactions
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Billing transactions retrieved successfully.
  /api/ai-interviews/answers/{answer_id}/evaluation/:
    get:
      operationId: ai_answer_evaluation_detail_retrieve
      description: Returns an evaluation for an answer belonging to a job owned by
        the authenticated employer.
      summary: Retrieve answer evaluation
      parameters:
      - in: path
        name: answer_id
        schema:
          type: integer
        required: true
      tags:
      - ai-interviews
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAnswerEvaluation'
          description: ''
        '404':
          description: Answer or evaluation not found.
  /api/ai-interviews/answers/evaluate/:
    post:
      operationId: ai_answer_evaluation_create
      description: Creates or updates an answer and evaluates it for a question belonging
        to a job owned by the authenticated employer.
      summary: Evaluate an AI interview answer
      tags:
      - ai-interviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIAnswerEvaluationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIAnswerEvaluationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIAnswerEvaluationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAnswerEvaluation'
          description: ''
        '400':
          description: question_id and answer are required.
        '404':
          description: Question not found or not accessible.
  /api/ai-interviews/applications/{application_id}/report/:
    get:
      operationId: ai_candidate_report_retrieve
      description: Returns the existing AI candidate report for an application belonging
        to a job owned by the authenticated employer.
      summary: Retrieve candidate report
      parameters:
      - in: path
        name: application_id
        schema:
          type: integer
        required: true
      tags:
      - ai-interviews
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AICandidateReport'
          description: ''
        '404':
          description: Application or candidate report not found.
    post:
      operationId: ai_candidate_report_create
      description: Generates an AI candidate report for an application belonging to
        a job owned by the authenticated employer.
      summary: Generate candidate report
      parameters:
      - in: path
        name: application_id
        schema:
          type: integer
        required: true
      tags:
      - ai-interviews
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AICandidateReport'
          description: ''
        '404':
          description: Application not found or not owned by this employer.
  /api/ai-interviews/jobs/{job_id}/audit/:
    get:
      operationId: ai_interview_audit_retrieve
      description: Returns AI interview calls, sessions, and call logs for a job owned
        by the authenticated employer.
      summary: Retrieve AI interview audit
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - ai-interviews
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIInterviewAuditResponse'
          description: ''
        '404':
          description: Job not found or not owned by this employer.
  /api/ai-interviews/jobs/{job_id}/reminders/:
    get:
      operationId: interview_reminders_list
      description: Returns reminder records for interviews associated with a job owned
        by the authenticated employer.
      summary: List interview reminders
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - ai-interviews
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewReminderListResponse'
          description: ''
        '404':
          description: Job not found or not owned by this employer.
  /api/ai-interviews/jobs/{job_id}/slots/:
    get:
      operationId: interview_available_slots_list
      description: Returns available scheduling slots for a job owned by the authenticated
        employer.
      summary: List available interview slots
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - ai-interviews
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableInterviewSlotResponse'
          description: ''
        '404':
          description: Job not found or not owned by this employer.
  /api/ai-interviews/schedule/:
    post:
      operationId: interview_schedule_create
      description: Schedules an interview using an available slot for a job owned
        by the authenticated employer.
      summary: Schedule an interview
      tags:
      - ai-interviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewScheduleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InterviewScheduleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InterviewScheduleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewScheduleResponse'
          description: ''
        '400':
          description: Missing fields, duplicate schedule, or scheduling error.
        '404':
          description: Interview call or availability slot not found.
  /api/applications/{application_id}/ats-score/:
    get:
      operationId: applications_ats_score_retrieve
      description: Calculate and save the ATS score after checking candidate or employer
        ownership.
      summary: Calculate application ATS score
      parameters:
      - in: path
        name: application_id
        schema:
          type: integer
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          description: ATS score and scoring details.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationErrorResponse'
          description: Access denied.
        '404':
          description: Application not found.
  /api/applications/{application_id}/auto-process/:
    patch:
      operationId: applications_auto_process_partial_update
      description: Run the application auto-processing logic using its existing ATS
        score.
      summary: Automatically process an application
      parameters:
      - in: path
        name: application_id
        schema:
          type: integer
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoProcessApplicationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationErrorResponse'
          description: ATS score is not available.
        '403':
          description: Permission denied.
        '404':
          description: Application not found.
  /api/applications/{application_id}/status/:
    patch:
      operationId: applications_status_partial_update
      description: Update an application's status for a job owned by the authenticated
        employer.
      summary: Update application status
      parameters:
      - in: path
        name: application_id
        schema:
          type: integer
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApplicationStatusUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApplicationStatusUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApplicationStatusUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationErrorResponse'
          description: Invalid application status.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationErrorResponse'
          description: You do not own this job or are not authorized.
        '404':
          description: Application not found.
  /api/applications/{job_id}/apply/:
    post:
      operationId: applications_apply_create
      description: Submit an application for an active job. Duplicate applications
        are rejected.
      summary: Apply for a job
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobApplication'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobApplication'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobApplication'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationErrorResponse'
          description: Duplicate application or invalid application data.
        '403':
          description: Permission denied.
        '404':
          description: Candidate profile or active job not found.
  /api/applications/analytics/:
    get:
      operationId: applications_analytics_retrieve
      description: Retrieve overall recruitment funnel analytics for the authenticated
        employer.
      summary: Get recruiter analytics overview
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Recruiter overview analytics.
        '403':
          description: Permission denied.
  /api/applications/job/{job_id}/analytics/:
    get:
      operationId: applications_job_analytics_retrieve
      description: Retrieve application counts for an employer-owned job.
      summary: Get job application analytics
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAnalyticsResponse'
          description: ''
        '403':
          description: Permission denied.
        '404':
          description: Job not found.
  /api/applications/job/{job_id}/applications/:
    get:
      operationId: applications_job_applications_list
      description: List applications for an employer-owned job. Supports status filtering
        and candidate username search.
      summary: List applications for a job
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPLIED
          - INTERVIEW
          - REJECTED
          - SELECTED
          - SHORTLISTED
        description: |-
          * `APPLIED` - Applied
          * `SHORTLISTED` - Shortlisted
          * `INTERVIEW` - Interview Scheduled
          * `REJECTED` - Rejected
          * `SELECTED` - Selected
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobApplication'
          description: ''
        '403':
          description: Permission denied.
        '404':
          description: Job not found.
  /api/applications/job/{job_id}/auto-process/:
    patch:
      operationId: applications_job_auto_process_partial_update
      description: Queue background processing for applications belonging to an employer-owned
        job.
      summary: Start automatic job application processing
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoProcessJobResponse'
          description: ''
        '403':
          description: Permission denied.
        '404':
          description: Job not found.
  /api/applications/job/{job_id}/ranked-candidates/:
    get:
      operationId: applications_job_ranked_candidates_list
      description: Retrieve candidates ranked by their ATS scores for an employer-owned
        job.
      summary: Rank candidates for a job
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankedCandidate'
          description: ''
        '403':
          description: Permission denied.
        '404':
          description: Job not found.
  /api/applications/jobs/{job_id}/premium-ranking/:
    get:
      operationId: applications_jobs_premium_ranking_retrieve
      description: Retrieve ATS-ranked candidates for an employer-owned job with premium
        recruiter access.
      summary: Get premium candidate rankings
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiumCandidateRankingResponse'
          description: ''
        '403':
          description: Permission denied or premium access required.
        '404':
          description: Job not found.
  /api/applications/jobs/{job_id}/recruiter-analytics/:
    get:
      operationId: applications_jobs_recruiter_analytics_retrieve
      description: Retrieve funnel analytics for a job owned by the authenticated
        employer.
      summary: Get recruiter analytics for a job
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Job-level recruiter funnel analytics.
        '403':
          description: Permission denied.
        '404':
          description: Job not found.
  /api/applications/my-applications/:
    get:
      operationId: applications_my_applications_list
      description: Retrieve the authenticated candidate's job applications.
      summary: List my applications
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobApplication'
          description: ''
        '403':
          description: Permission denied.
  /api/applications/premium-analytics/:
    get:
      operationId: applications_premium_analytics_retrieve
      description: Retrieve premium recruitment analytics, including conversion rates
        and job-level metrics.
      summary: Get premium recruiter analytics
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiumRecruiterAnalyticsResponse'
          description: ''
        '403':
          description: Permission denied or premium access required.
  /api/audit/logs/:
    get:
      operationId: audit_logs_list
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/jobs/:
    get:
      operationId: jobs_list
      description: Returns active jobs with pagination, filtering, and search. Available
        filter parameters are defined by JobFilter.
      summary: List active jobs
      parameters:
      - in: query
        name: experience
        schema:
          type: string
      - in: query
        name: job_type
        schema:
          type: string
          enum:
          - CONTRACT
          - FULL_TIME
          - INTERNSHIP
          - PART_TIME
        description: |-
          * `FULL_TIME` - Full Time
          * `PART_TIME` - Part Time
          * `INTERNSHIP` - Internship
          * `CONTRACT` - Contract
      - in: query
        name: location
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:

components:
  schemas:
    AIAnswerEvaluation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        answer:
          type: integer
        relevance_score:
          type: number
          format: double
          readOnly: true
        completeness_score:
          type: number
          format: double
          readOnly: true
        keyword_score:
          type: number
          format: double
          readOnly: true
        final_score:
          type: number
          format: double
          readOnly: true
        confidence:
          type: number
          format: double
          readOnly: true
          nullable: true
        ai_annotation:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - ai_annotation
      - answer
      - completeness_score
      - confidence
      - created_at
      - final_score
      - id
      - keyword_score
      - relevance_score
    AIAnswerEvaluationRequest:
      type: object
      properties:
        question_id:
          type: integer
        answer:
          type: string
      required:
      - answer
      - question_id
    AICandidateReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        application:
          type: integer
        ats_score:
          type: number
          format: double
        ai_call_score:
          type: number
          format: double
        overall_score:
          type: number
          format: double
        summary:
          type: string
        strengths: {}
        risks: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - application
      - created_at
      - id
      - updated_at
    AIInterviewAuditResponse:
      type: object
      properties:
        job_id:
          type: integer
        job_title:
          type: string
        total_calls:
          type: integer
        queued_calls:
          type: integer
        in_progress_calls:
          type: integer
        completed_calls:
          type: integer
        failed_calls:
          type: integer
        calls:
          type: array
          items: {}
      required:
      - calls
      - completed_calls
      - failed_calls
      - in_progress_calls
      - job_id
      - job_title
      - queued_calls
      - total_calls
    AdminActionLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        admin_username:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 100
        target_username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - admin_username
      - created_at
      - id
      - target_username
    ApplicationErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    ApplicationStatusUpdateStatusEnum:
      enum:
      - APPLIED
      - SHORTLISTED
      - INTERVIEW
      - REJECTED
      - SELECTED
      type: string
      description: |-
        * `APPLIED` - APPLIED
        * `SHORTLISTED` - SHORTLISTED
        * `INTERVIEW` - INTERVIEW
        * `REJECTED` - REJECTED
        * `SELECTED` - SELECTED
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          readOnly: true
          nullable: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        details:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - details
      - id
      - ip_address
      - resource_id
      - resource_type
      - user
    AutoProcessApplicationResponse:
      type: object
      properties:
        message:
          type: string
        application_id:
          type: integer
        ats_score:
          type: number
          format: double
        status:
          type: string
      required:
      - application_id
      - ats_score
      - message
      - status
    AutoProcessJobResponse:
      type: object
      properties:
        message:
          type: string
        job_id:
          type: integer
        task_id:
          type: string
      required:
      - job_id
      - message
      - task_id
    AvailableInterviewSlotResponse:
      type: object
      properties:
        id:
          type: integer
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
      required:
      - end_time
      - id
      - start_time
    CandidateProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        skills:
          type: string
        education:
          type: string
        experience:
          type: string
        expected_salary:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        resume:
          type: string
          format: uri
          nullable: true
        is_deleted:
          type: boolean
        user:
          type: integer
          readOnly: true
      required:
      - id
      - user
    CapturePayment:
      type: object
      properties:
        payment_id:
          type: string
      required:
      - payment_id
    CapturePaymentResponse:
      type: object
      properties:
        detail:
          type: string
        transaction_id:
          type: string
        payment_id:
          type: string
        status:
          type: string
      required:
      - detail
      - status
    CreatePaymentOrder:
      type: object
      properties:
        plan_id:
          type: integer
      required:
      - plan_id
    CreatePaymentOrderResponse:
      type: object
      properties:
        transaction_id:
          type: string
        order_id:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
        status:
          type: string
      required:
      - amount
      - currency
      - order_id
      - status
      - transaction_id
    CurrentSubscriptionResponse:
      type: object
      properties:
        has_active_subscription:
          type: boolean
        plan:
          type: string
        status:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        features:
          $ref: '#/components/schemas/SubscriptionFeatures'
        max_job_posts:
          type: integer
      required:
      - features
      - has_active_subscription
      - plan
    DashboardStats:
      type: object
      properties:
        applied_jobs:
          type: integer
        shortlisted:
          type: integer
        interviews:
          type: integer
        selected:
          type: integer
        rejected:
          type: integer
      required:
      - applied_jobs
      - interviews
      - rejected
      - selected
      - shortlisted
    InterviewReminderListResponse:
      type: object
      properties:
        job_id:
          type: integer
        job_title:
          type: string
        total_reminders:
          type: integer
        pending_reminders:
          type: integer
        sent_reminders:
          type: integer
        failed_reminders:
          type: integer
        reminders:
          type: array
          items: {}
      required:
      - failed_reminders
      - job_id
      - job_title
      - pending_reminders
      - reminders
      - sent_reminders
      - total_reminders
    InterviewScheduleRequest:
      type: object
      properties:
        call_id:
          type: integer
        slot_id:
          type: integer
      required:
      - call_id
      - slot_id
    InterviewScheduleResponse:
      type: object
      properties:
        message:
          type: string
        schedule_id:
          type: integer
        call_id:
          type: integer
        slot_id:
          type: integer
        scheduled_start:
          type: string
          format: date-time
        scheduled_end:
          type: string
          format: date-time
        status:
          type: string
      required:
      - call_id
      - message
      - schedule_id
      - scheduled_end
      - scheduled_start
      - slot_id
      - status
    Job:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        skills:
          type: string
          description: 'Example: Python, Django, SQL'
        experience:
          type: string
          maxLength: 100
        education:
          type: string
          maxLength: 200
        salary_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        salary_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        location:
          type: string
          maxLength: 200
        job_type:
          $ref: '#/components/schemas/JobTypeEnum'
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
